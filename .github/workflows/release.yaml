name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd custom_components/minimal_slideshow && zip -r ../../minimal_slideshow.zip . -x '*__pycache__*' '*.pyc'
      - run: gh release upload "$RELEASE_TAG" minimal_slideshow.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
